# Callie Light: the default theme's pinks, stickers and type on warm, light
# backgrounds. Anything not set here comes from callie.toml.

[theme]
name = "Callie Light"
variant = "light"

[colors]
background = "#fbf5f8"
surface = "#fffafc"
surface-alt = "#f3e7ee"
hairline = "#efe2e9"
border = "#e0ccd7"
text = "#2b1a26"
text-muted = "#6b5562"
text-faint = "#8f7a87"
accent = "#e45f97"
accent-text = "#2e0f20"
danger = "#c93c45"
edge = "#dcc8d3"
accent-edge = "#a83a6d"

# Stickers keep their pastel fill, with ink and edge tuned for a light page.
[calendar]
lightness = 0.88
chroma = 0.07
ink-lightness = 0.3
ink-chroma = 0.07
edge-lightness = 0.72
edge-chroma = 0.08

[shadow]
color = "#5c2a47"
opacity = 0.18
blur = 30
offset = 10

# ANSI colors at OKLCH lightness 0.53 and chroma 0.10, with bright a step darker
# for emphasis, and text a step softer than the app's.
[terminal]
foreground = "#55414e"
black = "#2b1a26"
red = "#9e5251"
green = "#3f7b4a"
yellow = "#886518"
blue = "#4b6ba6"
magenta = "#985270"
cyan = "#027c7d"
white = "#8f7a87"
bright-black = "#6b5562"
bright-red = "#8a4140"
bright-green = "#2d6a39"
bright-yellow = "#755402"
bright-blue = "#3b5993"
bright-magenta = "#85415f"
bright-cyan = "#006869"
bright-white = "#dcc8d3"
selection = "#e0ccd7"
