# Callie, the default theme. Every other theme inherits whatever it leaves out
# from this file, so it sets every key.

[theme]
name = "Callie"
variant = "dark"

[colors]
background = "#1c1220"
surface = "#261a2a"
surface-alt = "#33243a"
hairline = "#2c2031"
border = "#3d2c42"
text = "#f6eef5"
text-muted = "#c9b7c6"
text-faint = "#9a8797"
accent = "#f08fb8"
accent-text = "#2e0f20"
danger = "#e66e6d"
edge = "#140c17"
accent-edge = "#a64b7a"

# Calendar colors keep their hue and become pastel stickers: a fill, dark ink on
# it and a deeper edge under it. Lightness and chroma are OKLCH.
[calendar]
harmonize = true
lightness = 0.86
chroma = 0.073
ink-lightness = 0.27
ink-chroma = 0.06
edge-lightness = 0.6
edge-chroma = 0.095

[shape]
radius-small = 6
radius = 11
radius-large = 14
radius-xlarge = 16
sticker-edge = 3

[shadow]
color = "#000000"
opacity = 0.5
blur = 36
offset = 14

# Nunito and Fraunces ship with Callie. Empty means the system font.
[type]
family = "Nunito"
display-family = "Fraunces"
mono-family = ""
# Weights for strong text such as event titles, bold such as buttons, and heavy
# such as today and what is selected.
weight-strong = 600
weight-bold = 700
weight-heavy = 800

# Durations in milliseconds. Bounce is the overshoot when something arrives;
# 0 turns it off.
[motion]
duration-fast = 140
duration = 200
duration-slow = 280
bounce = 1.2

# The 16 ANSI colors and the text color for terminals and editors, softer than
# the app: each hue sits at OKLCH lightness 0.80 and chroma 0.075 (bright 0.87
# and 0.06), and text is a step below the app's, so long reading does not glare.
# Red starts from danger and magenta from accent.
[terminal]
foreground = "#e0d3df"
black = "#33243a"
red = "#eaaba8"
green = "#9dcca3"
yellow = "#d6ba86"
blue = "#a4beef"
magenta = "#e5aac1"
cyan = "#82cdcd"
white = "#c9b7c6"
bright-black = "#9a8797"
bright-red = "#fac5c2"
bright-green = "#bae0be"
bright-yellow = "#e8d1a8"
bright-blue = "#bfd5fd"
bright-magenta = "#f5c5d7"
bright-cyan = "#a6e1e1"
bright-white = "#f6eef5"
selection = "#3d2c42"
